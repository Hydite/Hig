name: Publish HIG npm Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-v1.10.0
  cancel-in-progress: false

jobs:
  native-package:
    name: Publish native npm package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64-gnu
            binary: target/release/hig
            npm_package: hig-linux-x64-gnu
          - os: windows-2025
            platform: windows-x86_64-msvc
            binary: target/release/hig.exe
            npm_package: hig-win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install release npm client
        run: npm install --global npm@12.0.2
      - name: Check whether native package is already published
        id: registry
        shell: bash
        run: |
          present="$(node scripts/check-npm-package.mjs --package "@zorker/${{ matrix.npm_package }}" --version 1.10.0)"
          echo "present=${present}" >> "$GITHUB_OUTPUT"
      - name: Build native CLI
        if: steps.registry.outputs.present != 'true'
        run: cargo build --release -p hig-cli
      - name: Assemble npm packages
        if: steps.registry.outputs.present != 'true'
        shell: bash
        run: node scripts/package-npm-release.mjs --binary "${{ matrix.binary }}" --platform "${{ matrix.platform }}" --output-dir artifacts/npm
      - name: Verify clean npm installation
        if: steps.registry.outputs.present != 'true'
        shell: bash
        run: node scripts/verify-npm-package.mjs --main artifacts/npm/zorker-hig-1.10.0.tgz --native "artifacts/npm/zorker-${{ matrix.npm_package }}-1.10.0.tgz" --platform-package "${{ matrix.npm_package }}"
      - name: Publish native package
        if: steps.registry.outputs.present != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          node scripts/publish-npm-tarball.mjs --tarball "artifacts/npm/zorker-${{ matrix.npm_package }}-1.10.0.tgz" --package "@zorker/${{ matrix.npm_package }}" --version 1.10.0

  macos-universal-package:
    name: Publish native npm package (macOS universal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install release npm client
        run: npm install --global npm@12.0.2
      - name: Check whether native package is already published
        id: registry
        run: |
          present="$(node scripts/check-npm-package.mjs --package @zorker/hig-darwin-universal --version 1.10.0)"
          echo "present=${present}" >> "$GITHUB_OUTPUT"
      - name: Build universal CLI
        if: steps.registry.outputs.present != 'true'
        run: |
          cargo build --release -p hig-cli --target aarch64-apple-darwin
          cargo build --release -p hig-cli --target x86_64-apple-darwin
          mkdir -p target/release-universal
          lipo -create \
            target/aarch64-apple-darwin/release/hig \
            target/x86_64-apple-darwin/release/hig \
            -output target/release-universal/hig
          lipo target/release-universal/hig -verify_arch arm64 x86_64
      - name: Assemble npm packages
        if: steps.registry.outputs.present != 'true'
        run: node scripts/package-npm-release.mjs --binary target/release-universal/hig --platform macos-universal --output-dir artifacts/npm
      - name: Verify clean npm installation
        if: steps.registry.outputs.present != 'true'
        run: node scripts/verify-npm-package.mjs --main artifacts/npm/zorker-hig-1.10.0.tgz --native artifacts/npm/zorker-hig-darwin-universal-1.10.0.tgz --platform-package hig-darwin-universal
      - name: Publish native package
        if: steps.registry.outputs.present != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          node scripts/publish-npm-tarball.mjs --tarball artifacts/npm/zorker-hig-darwin-universal-1.10.0.tgz --package @zorker/hig-darwin-universal --version 1.10.0

  main-package:
    name: Publish @zorker/hig
    needs: [native-package, macos-universal-package]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install release npm client
        run: npm install --global npm@12.0.2
      - name: Check whether main package is already published
        id: registry
        run: |
          present="$(node scripts/check-npm-package.mjs --package @zorker/hig --version 1.10.0)"
          echo "present=${present}" >> "$GITHUB_OUTPUT"
      - name: Validate resolver and package contents
        run: |
          node scripts/npm-resolver-test.mjs
          node scripts/verify-npm-registry.mjs --version 1.10.0
      - name: Pack main package
        if: steps.registry.outputs.present != 'true'
        run: |
          mkdir -p artifacts/npm
          npm pack ./packages/hig-mcp-server --pack-destination artifacts/npm
      - name: Publish main package
        if: steps.registry.outputs.present != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami
          node scripts/publish-npm-tarball.mjs --tarball artifacts/npm/zorker-hig-1.10.0.tgz --package @zorker/hig --version 1.10.0
