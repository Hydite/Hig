name: HIG Quality Gates

on:
  push:
    branches: [Public]
  pull_request:
    branches: [Public]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop dependency and frontend gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/hig-desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.20.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: JavaScript dependency vulnerability audit
        run: pnpm audit --audit-level moderate --registry=https://registry.npmjs.org
      - name: Desktop tests
        run: pnpm test
      - name: Desktop lint
        run: pnpm lint
      - name: Desktop production build
        run: pnpm build

  correctness:
    name: Core, CLI, compatibility, and MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install native filesystem test tools
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Format
        run: cargo fmt --all --check
      - name: Core and CLI tests
        run: cargo test -p hig-core -p hig-cli
      - name: Strict Clippy
        run: cargo clippy -p hig-core -p hig-cli -p hig-ffi --all-targets -- -D warnings
      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Rust dependency vulnerability audit
        run: cargo audit
      - name: Release CLI
        run: cargo build --release -p hig-cli
      - name: Runtime format matrix
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: bash scripts/hig-compatibility-matrix.sh
      - name: Historical golden fixtures
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: bash scripts/verify-golden-fixtures.sh
      - name: Recovery Vault operator drill
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: node scripts/recovery-vault-runbook-test.mjs
      - name: MCP protocol and constrained workflow
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: |
          node scripts/npm-resolver-test.mjs
          node scripts/mcp-integration-test.mjs
      - name: Repository recovery and interruption smoke
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: node scripts/repository-soak-test.mjs --mode ci --duration-minutes 0.25 --report artifacts/repository-soak-ci.json
      - name: Recovery Vault loss and interruption smoke
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: node scripts/recovery-vault-soak-test.mjs --mode ci --duration-minutes 0.25 --report artifacts/recovery-vault-soak-ci.json
      - name: Recovery Vault qualified benchmark smoke
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: |
          node scripts/recovery-vault-qualified-benchmark.mjs --mode ci --fixture-mib 32 --report artifacts/recovery-vault-qualified-ci.json
          node scripts/validate-recovery-vault-qualified-report.mjs --report artifacts/recovery-vault-qualified-ci.json --expected-commit "${{ github.sha }}" --expected-mode ci --minimum-fixture-bytes 33554432
      - name: Recovery Vault real capacity exhaustion
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: |
          capacity_root="${RUNNER_TEMP}/hig-recovery-capacity"
          sudo mkdir -p "$capacity_root"
          sudo mount -t tmpfs -o size=64m,mode=0700 tmpfs "$capacity_root"
          sudo chown "$(id -u):$(id -g)" "$capacity_root"
          trap 'sudo umount "$capacity_root"' EXIT
          node scripts/recovery-vault-capacity-test.mjs \
            --vault-root "$capacity_root" \
            --report artifacts/recovery-vault-capacity-ci.json
      - name: Cold-path regression policy
        env:
          HIG_BIN: ${{ github.workspace }}/target/release/hig
        run: |
          node scripts/cold-path-regression-test.mjs --self-test
          node scripts/cold-path-regression-test.mjs --mode ci --report artifacts/cold-path-regression-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-regression-evidence-${{ github.sha }}
          path: |
            artifacts/repository-soak-ci.json
            artifacts/recovery-vault-soak-ci.json
            artifacts/recovery-vault-capacity-ci.json
            artifacts/cold-path-regression-ci.json
          if-no-files-found: error

  native-package:
    name: Native package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64-gnu
            binary: target/release/hig
            npm_package: hig-linux-x64-gnu
          - os: windows-2025
            platform: windows-x86_64-msvc
            binary: target/release/hig.exe
            npm_package: hig-win32-x64-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Linux filesystem test tools
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y acl
      - name: Native repository fidelity tests
        run: "cargo test -p hig-core repository::tests::"
      - name: Native CLI tests
        run: cargo test -p hig-cli
      - name: Build native CLI
        run: cargo build --release -p hig-cli
      - name: Native repository snapshot diagnostic
        shell: bash
        run: |
          mkdir -p target/native-repo-smoke/src
          printf 'native package repository smoke\n' > target/native-repo-smoke/README.md
          printf 'pub fn native_smoke() -> u8 { 1 }\n' > target/native-repo-smoke/src/lib.rs
          "${{ matrix.binary }}" repo init target/native-repo-smoke --json
          "${{ matrix.binary }}" repo snapshot target/native-repo-smoke --message native-smoke --json
          "${{ matrix.binary }}" repo verify target/native-repo-smoke --json
      - name: Native historical fixture migration
        shell: bash
        env:
          HIG_BIN: ${{ matrix.binary }}
        run: bash scripts/verify-golden-fixtures.sh
      - name: Native Recovery Vault operator drill
        shell: bash
        env:
          HIG_BIN: ${{ matrix.binary }}
        run: node scripts/recovery-vault-runbook-test.mjs
      - name: Assemble native IDE/MCP package
        shell: bash
        run: node scripts/package-ide-mcp.mjs --binary "${{ matrix.binary }}" --platform "${{ matrix.platform }}" --output-dir artifacts/ci
      - name: Verify extracted native package
        shell: bash
        run: node scripts/verify-ide-package.mjs "artifacts/ci/hig-v1.10.0-ide-mcp-${{ matrix.platform }}.tar.gz"
      - name: Assemble native npm packages
        shell: bash
        run: node scripts/package-npm-release.mjs --binary "${{ matrix.binary }}" --platform "${{ matrix.platform }}" --output-dir artifacts/ci/npm
      - name: Verify installed native npm packages
        shell: bash
        run: node scripts/verify-npm-package.mjs --main artifacts/ci/npm/zorker-hig-1.10.0.tgz --native "artifacts/ci/npm/zorker-${{ matrix.npm_package }}-1.10.0.tgz" --platform-package "${{ matrix.npm_package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hig-v1.10.0-ide-mcp-${{ matrix.platform }}
          path: |
            artifacts/ci/hig-v1.10.0-ide-mcp-${{ matrix.platform }}.tar.gz
            artifacts/ci/hig-v1.10.0-ide-mcp-${{ matrix.platform }}.tar.gz.sha256
            artifacts/ci/npm/zorker-hig-1.10.0.tgz
            artifacts/ci/npm/zorker-${{ matrix.npm_package }}-1.10.0.tgz
          if-no-files-found: error

  macos-universal-package:
    name: Native package (macOS universal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Native repository fidelity tests
        run: "cargo test -p hig-core repository::tests::"
      - name: Native CLI tests
        run: cargo test -p hig-cli
      - name: Build both macOS architectures
        run: |
          cargo build --release -p hig-cli --target aarch64-apple-darwin
          cargo build --release -p hig-cli --target x86_64-apple-darwin
          mkdir -p target/release-universal
          lipo -create \
            target/aarch64-apple-darwin/release/hig \
            target/x86_64-apple-darwin/release/hig \
            -output target/release-universal/hig
          lipo target/release-universal/hig -verify_arch arm64 x86_64
      - name: Assemble universal IDE/MCP package
        run: node scripts/package-ide-mcp.mjs --binary target/release-universal/hig --platform macos-universal --output-dir artifacts/ci
      - name: Universal historical fixture migration
        env:
          HIG_BIN: ${{ github.workspace }}/target/release-universal/hig
        run: bash scripts/verify-golden-fixtures.sh
      - name: Universal Recovery Vault operator drill
        env:
          HIG_BIN: ${{ github.workspace }}/target/release-universal/hig
        run: node scripts/recovery-vault-runbook-test.mjs
      - name: Verify extracted universal package
        run: node scripts/verify-ide-package.mjs artifacts/ci/hig-v1.10.0-ide-mcp-macos-universal.tar.gz
      - name: Assemble universal npm packages
        run: node scripts/package-npm-release.mjs --binary target/release-universal/hig --platform macos-universal --output-dir artifacts/ci/npm
      - name: Verify installed universal npm packages
        run: node scripts/verify-npm-package.mjs --main artifacts/ci/npm/zorker-hig-1.10.0.tgz --native artifacts/ci/npm/zorker-hig-darwin-universal-1.10.0.tgz --platform-package hig-darwin-universal
      - uses: actions/upload-artifact@v4
        with:
          name: hig-v1.10.0-ide-mcp-macos-universal
          path: |
            artifacts/ci/hig-v1.10.0-ide-mcp-macos-universal.tar.gz
            artifacts/ci/hig-v1.10.0-ide-mcp-macos-universal.tar.gz.sha256
            artifacts/ci/npm/zorker-hig-1.10.0.tgz
            artifacts/ci/npm/zorker-hig-darwin-universal-1.10.0.tgz
          if-no-files-found: error
