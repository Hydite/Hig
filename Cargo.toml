[workspace]
members = [
  "crates/hig-cli",
  "crates/hig-core",
  "crates/hig-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/hig"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
bincode = "1.3"
blake3 = "1.8"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
walkdir = "2.5"
zstd = "0.13"
