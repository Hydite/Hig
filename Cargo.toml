[workspace]
members = [
  "apps/hig-desktop/src-tauri",
  "crates/hig-cli",
  "crates/hig-core",
  "crates/hig-ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Hydite/Hig"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
bincode = "1.3"
blake3 = "1.8"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
hex = "0.4"
fs2 = "0.4"
fastcdc = "4.0.1"
libc = "0.2"
notify = "8.2"
rand = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tree-sitter = "0.26.11"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5"
windows-sys = "0.61"
xattr = "1.6"
zstd = "0.13"
zeroize = "1.8"
